# The knowledge base (kb/index.json), read again every Monday: the pages of
# Giga Maps, Giga Meter, Connectivity Credits, Spectrum Certificates and the
# UNICEF Digital Impact site (kb/sources.json). When anything changed, a pull
# request says what in kb/CHANGES.md; merging it deploys the new pages.
name: Knowledge base update

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx tools/kb-update.ts
      - name: Pull request with what changed
        uses: peter-evans/create-pull-request@v7
        with:
          branch: kb/weekly-update
          title: "Knowledge base: this week's changes on the product sites"
          body-path: kb/CHANGES.md
          commit-message: "Knowledge base: this week's pages from the product sites"
          add-paths: kb/
          delete-branch: true
